name: Build, Release, and Update Homebrew

on:
  push:
    branches:
      - main # Triggers on merge/push to main branch

jobs:
  release:
    name: Build DMG & Update Cask
    runs-on: macos-latest
    permissions:
      contents: write # Needed to push release and commit updates
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to calculate semantic version tags

      - name: Calculate Semantic Version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Update Xcode App Version
        run: |
          # The semantic version without 'v' (e.g. 1.0.1)
          APP_VERSION=${{ steps.tag_version.outputs.new_version }}
          
          # Replace MARKETING_VERSION in all targets in the pbxproj
          sed -i '' 's/MARKETING_VERSION = .*/MARKETING_VERSION = '$APP_VERSION';/' stasis.xcodeproj/project.pbxproj
          
          # Also increment the CURRENT_PROJECT_VERSION (build number) using GitHub Run ID to be unique
          sed -i '' 's/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = '${{ github.run_number }}';/' stasis.xcodeproj/project.pbxproj

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project stasis.xcodeproj \
            -scheme "stasis-release" \
            -configuration Release \
            -archivePath $PWD/build/Stasis.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Export Archive
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/Stasis.xcarchive \
            -exportPath $PWD/build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          cd build/export
          mkdir -p dmg_root
          cp -R "Stasis.app" dmg_root/
          codesign --force --deep --sign - "dmg_root/Stasis.app"
          create-dmg \
            --volname "Stasis" \
            --volicon "Stasis.app/Contents/Resources/AppIcon.icns" \
            --window-pos 340 200 \
            --window-size 600 400 \
            --icon-size 100 \
            --background "../../assets/dmg-background.png" \
            --icon "Stasis.app" 123 210 \
            --hide-extension "Stasis.app" \
            --app-drop-link 430 220 \
            "../../Stasis.dmg" \
            "dmg_root"

      - name: Package Sparkle ZIP
        run: |
          cd build/export
          ditto -c -k --sequesterRsrc --keepParent "Stasis.app" "../Stasis-${{ steps.tag_version.outputs.new_version }}.zip"

      - name: Resolve Sparkle tools
        id: sparkle_tools
        run: |
          SPARKLE_BIN_DIR="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*SourcePackages/artifacts/sparkle/Sparkle/bin' -type d | head -n 1)"
          if [ -z "$SPARKLE_BIN_DIR" ]; then
            echo "Sparkle tools not found in DerivedData"
            exit 1
          fi
          echo "bin_dir=$SPARKLE_BIN_DIR" >> "$GITHUB_OUTPUT"

      - name: Sign Sparkle update archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret"
            exit 1
          fi
          mkdir -p build/keys
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > build/keys/sparkle_private_key
          chmod 600 build/keys/sparkle_private_key
          "${{ steps.sparkle_tools.outputs.bin_dir }}/sign_update" "build/Stasis-${{ steps.tag_version.outputs.new_version }}.zip" -f "build/keys/sparkle_private_key" | tee build/sign_update_output.txt

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_DOWNLOAD_BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_version.outputs.new_tag }}/"
          mkdir -p releases/notes releases/appcast build/sparkle-input
          if [ ! -f "releases/notes/${{ steps.tag_version.outputs.new_version }}.html" ]; then
            printf '%s\n' '<!doctype html><html><body><h1>Stasis ${{ steps.tag_version.outputs.new_version }}</h1><p>Release notes coming soon.</p></body></html>' > "releases/notes/${{ steps.tag_version.outputs.new_version }}.html"
          fi
          cp "build/Stasis-${{ steps.tag_version.outputs.new_version }}.zip" "build/sparkle-input/"
          "${{ steps.sparkle_tools.outputs.bin_dir }}/generate_appcast" \
            --ed-key-file "build/keys/sparkle_private_key" \
            --download-url-prefix "${SPARKLE_DOWNLOAD_BASE_URL}" \
            --release-notes-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_version.outputs.new_tag }}/" \
            --maximum-versions 25 \
            -o "releases/appcast/appcast.xml" \
            "build/sparkle-input"

          # Fallback: if generate_appcast omits enclosure signature, inject from sign_update output
          SIG="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' build/sign_update_output.txt | tail -n 1)"
          if [ -n "$SIG" ]; then
            perl -0777 -i -pe 's#(<enclosure\s+)(?![^>]*sparkle:(?:edSignature|signature)=)([^>]*)(/>)#$1$2 sparkle:edSignature="'"$SIG"'"$3#g' releases/appcast/appcast.xml
          fi

      - name: Validate Sparkle appcast
        run: |
          APPCAST="releases/appcast/appcast.xml"
          TAG="${{ steps.tag_version.outputs.new_tag }}"

          test -f "$APPCAST" || { echo "Missing appcast.xml"; exit 1; }

          grep -q "<item>" "$APPCAST" || { echo "Appcast has no <item> entries"; exit 1; }
          if ! grep -q "sparkle:edSignature=" "$APPCAST" && ! grep -q "sparkle:signature=" "$APPCAST"; then
            echo "Missing Sparkle enclosure signature (sparkle:edSignature or sparkle:signature)"
            exit 1
          fi
          grep -q "/releases/download/${TAG}/" "$APPCAST" || { echo "Enclosure URL missing tag path /releases/download/${TAG}/"; exit 1; }

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: |
            Stasis.dmg
            build/Stasis-${{ steps.tag_version.outputs.new_version }}.zip
            releases/appcast/appcast.xml
            releases/notes/${{ steps.tag_version.outputs.new_version }}.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate SHA256
        id: shasum
        run: |
          echo "sha256=$(shasum -a 256 Stasis.dmg | awk '{print $1}')" >> $GITHUB_ENV
          echo "version=${{ steps.tag_version.outputs.new_version }}" >> $GITHUB_ENV

      - name: Update Homebrew Cask and Commit
        run: |
          # Replace version in stasis.rb
          sed -i '' 's/version ".*"/version "'${{ env.version }}'"/' Casks/stasis.rb
          # Replace sha256 in stasis.rb
          sed -i '' 's/sha256 ".*"/sha256 "'${{ env.sha256 }}'"/' Casks/stasis.rb
          
          # Commit the updated ruby file and pbxproj to the repository
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/stasis.rb
          git add stasis.xcodeproj/project.pbxproj
          git commit -m "chore: bump version to v${{ env.version }} and update Homebrew Cask [skip ci]"
          git push origin main
